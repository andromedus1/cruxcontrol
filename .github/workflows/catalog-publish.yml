name: Catalog publish

# Builds the next Kilter Fullride catalog version from Boardsesh's public snapshot and
# publishes it to the private catalog bucket. Inert until the operator provisions the
# resources and sets repository variable CATALOG_PUBLISH_ENABLED=true (docs/DEPLOY.md).
on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC; one Boardsesh fetch per artifact per run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    name: build and publish catalog
    if: vars.CATALOG_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless Workload Identity Federation; no stored cloud keys
      issues: write   # open/update the single "held" issue
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud (publisher identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CATALOG_WIF_PROVIDER }}
          service_account: ${{ vars.CATALOG_PUBLISHER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and publish
        id: publish
        env:
          CATALOG_BUCKET: ${{ vars.CATALOG_BUCKET }}
        run: web/scripts/catalog-publish.sh

      - name: Report held update
        if: steps.publish.outputs.result == 'held'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.publish.outputs.report }}
        run: web/scripts/catalog-hold-issue.sh "$REPORT"

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.publish.outputs.result }}
        run: |
          echo "Catalog publish result: ${RESULT:-failed}" >> "$GITHUB_STEP_SUMMARY"
