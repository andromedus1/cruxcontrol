name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The real PWA update browser fixture builds the immutable legacy
          # generation from a pinned ancestor, so a shallow clone cannot run it.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @cruxcontrol/web

      - name: Typecheck
        run: npm run typecheck -w @cruxcontrol/web

      - name: Test
        run: npm test -w @cruxcontrol/web

      - name: Build
        run: npm run build -w @cruxcontrol/web

      - name: Verify PWA and catalog build artifacts
        run: node web/scripts/check-pwa-build.mjs

      - name: Install Chromium for browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test browser workflows
        run: npm -w web run test:e2e

      - name: Test bundled catalog worker persistence
        run: npm -w web run test:e2e:catalog-bootstrap

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios-prototype:
    name: ios prototype (assets / browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup prototype Node
        uses: actions/setup-node@v4
        with:
          node-version-file: prototypes/ios/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/ios/package-lock.json

      - name: Install web and prototype dependencies
        run: |
          npm ci
          npm --prefix prototypes/ios ci

      - name: Verify native adapter contracts
        run: |
          npm --prefix prototypes/ios run lint
          npm --prefix prototypes/ios test

      - name: Build and sync prototype assets
        run: npm --prefix prototypes/ios run sync

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Check packaged startup and synthetic library
        run: npm -w web run test:ios-prototype

      - name: Upload prototype failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-prototype-browser-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-prototype:
    name: Android prototype (native compile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: prototypes/ios/.nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/ios/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install web and native dependencies
        run: |
          npm ci
          npm --prefix prototypes/ios ci

      - name: Compile bundled Android app
        run: npm --prefix prototypes/ios run build:android

  ml:
    name: ml (stub lane)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stub lane for epic-grade-prediction. The ml/ project is a pyproject.toml
      # placeholder today (no .py sources yet), so this compiles whatever Python
      # exists under ml/ as a real, non-fake smoke check. Replace with ruff/pytest
      # once the grade-prediction pipeline lands.
      - name: Compile-check ml sources (stub)
        run: python -m compileall ml

  deploy:
    name: deploy (Cloudflare Workers Static Assets)
    runs-on: ubuntu-latest
    # Gate: only deploy after the CI lane is green, only on push to main, and
    # only once deploy is explicitly enabled (repo variable ENABLE_DEPLOY=true).
    # The variable gate keeps main GREEN until the user has added the Cloudflare
    # secrets and opted in — otherwise every push to main would show a red deploy
    # job. See docs/DEPLOY.md.
    needs: [web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_DEPLOY == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build -w @cruxcontrol/web

      # SECRET WALL: requires repo secrets CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID (token from the "Edit Cloudflare Workers" template).
      # Until those exist this step fails clearly; see docs/DEPLOY.md.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
