  .research/briefs/kilter-grade-prediction/classical-models.md:
    summary: 'Gradient-boosted decision trees (XGBoost, LightGBM, CatBoost) are the natural strong baseline
      for grade prediction from engineered tabular features: on medium-sized (~10K-sample) tabular data
      they remain state-of-the-art versus deep nets, train fast on CPU, and export trivially to in-browser
      inference. Climbing grades are finite ordered categories, so the target is best framed as regression
      on a numeric grade index (cheap, order-aware) with optional ordinal-aware methods; plain multiclass
      classification wastes the ordering. Reported exact single-grade accuracy across the literature clusters
      at roughly 35-47% (near human ~45%), rising to ~84% with a +/-1-grade tolerance, with the best regression-style
      MoonBoard results near 0.86 MAE. SHAP / TreeExplainer gives consistent, per-prediction feature attributions
      that enable sandbag/soft-grade detection by flagging climbs whose predicted grade diverges from
      consensus with anomalous attributions.

      '
    key_findings:
    - GBT ensembles are the correct first baseline before deep models on engineered tabular features at
      this dataset scale; tree-based models "remain state-of-the-art on medium-sized data (~10K samples)"
      and beat tuned deep nets, while being faster and CPU-only. [grinsztajn-tree-vs-dl-tabular]{1}
    - Climbing grades are finite ordered categories — the textbook ordinal-regression setting; treat as
      numeric-index regression (order-aware, simple) rather than plain multiclass, which mis-penalizes
      distant-grade errors equally. [ordinal-regression-wikipedia]{2}
    - Expected performance bar from prior work: ~35-47% exact single-grade accuracy (~45% human), ~84%
        within +/-1 grade, best regression-style ~0.86 MAE; a Histogram Gradient Boosting Classifier reached
        91.75% over 21 Font grades and a Random Forest reached 0.378 RMSE on indoor routes. [frontiers-climbing-grading-bias]{3}
    - GBT win because they are robust to uninformative features, axis-aligned (orientation-preserving),
      and learn irregular/non-smooth functions natively — the three gaps deep nets struggle to close on
      tabular data. [grinsztajn-tree-vs-dl-tabular]{1}
    - For interpretability and sandbag detection, prefer SHAP/TreeExplainer over default gain importance,
      which "is biased to attribute more importance to lower splits"; SHAP is consistent, locally accurate,
      and exposes per-climb outlier attributions. [lundberg-shap-xgboost]{4}
  .research/briefs/kilter-grade-prediction/deep-representation-models.md:
    summary: 'Three deep representation families have been tried on MoonBoard-style boards (the closest
      prior art to Kilter). CNNs over the lit-hold grid are the simplest and most export-friendly but
      treat the board as a sparse image and plateau near 34% exact accuracy. Graph convolutional networks
      on a heterogeneous problem/hold co-occurrence graph improve robustness to class imbalance and the
      hard grades (~0.73 AUC) but the published variant is transductive (Text-GCN) and does not naturally
      export per-route inference to the browser. Sequence models (LSTM) over a human-ordered move sequence
      are the current prior-art frontier — GradeNet reached human-level ±1 accuracy (84.7%) — but their
      performance came almost entirely from a hand-engineered move-ordering preprocessor (BetaMove), not
      the network. Transformers have only been tried on tiny climbing datasets and underperformed. For
      Kilter, the binding constraints are dataset size relative to deep models'' data hunger and the need
      for a small, per-route, angle-conditioned model that exports cleanly to ONNX.js/TF.js.

      '
    key_findings:
    - On MoonBoard, sequence models (LSTM) reached human-level ±1 accuracy (GradeNet 84.7% within one
      grade, 46.7% exact), beating CNN (34%) and GCN (AUC 0.73) — but the gain came from the BetaMove
      move-ordering preprocessor, not the recurrent network; a naive RNN on raw hold lists scored only
      ~34.7% [duh-chang-rnn]{1}.
    - The "graph" in published climbing GCN work is a Text-GCN over a heterogeneous problem/hold co-occurrence
      graph (holds as words, problems as documents), NOT a move-graph; it is transductive and does not
      produce a clean per-new-route forward pass for browser inference [tai-gcn]{2}.
    - CNNs treat the board as a {0,1} grid image; the representation is "too sparse" and the inductive
      bias (translation invariance) is partly wrong for a fixed-position board, capping accuracy near
      34% [duh-chang-rnn]{1}, [tai-gcn]{2}.
    - GCNs are markedly more robust to the severe class imbalance (easy grades dominate) and out-perform
      classical/dense models specifically at the rare hard grades [tai-gcn]{2}.
    - The hard-grade error mode is a crux-move problem — a V11 may have one V11 move surrounded by V8
      moves — which motivates attention/pooling over moves rather than averaging [duh-chang-rnn]{1}.
    - Transformers have only been applied to a ~20-route (augmented to 1000) climbing dataset and failed
      (degenerate padding-token / non-hold outputs); attention is data-hungry and likely premature unless
      Kilter's dataset is large [poirier-transformer]{3}.
    - Across all families the practical accuracy bar is ±1-grade ≈ 84–85% (human parity); exact-grade
      accuracy across 10–12 classes sits ~40–47% [frontiers-grading-bias]{4}, [duh-chang-rnn]{1}.
  .research/briefs/kilter-grade-prediction/evaluation-methodology.md:
    summary: Defines the target variable, metrics, and leakage-safe splitting that the grade-prediction
      approaches must be judged against. The target is per-angle community-consensus difficulty (difficulty_average)
      filtered by ascent count; primary metrics are MAE/RMSE in grade units plus accuracy-within-±1-grade
      (~84-85% is human parity); the dominant validation risk is leakage from the same climb appearing
      at multiple angles and from setter/duplicate climbs, requiring grouped splits and per-fold preprocessing.
    key_findings:
    - Headline regression metrics for board-climb grade prediction are MAE and RMSE expressed in grade
      units; a strong published reference on Moonboard is ~0.87 MAE / ~1.12 RMSE [board-to-board]{1}.
    - Accuracy-within-±1-grade is the practical bar where models reach human-level parity (~84-85%), while
      exact-grade accuracy across 10-12 classes sits ~40-47% [frontiers-grading-bias]{2}.
    - The target should be per-angle community-consensus difficulty (difficulty_average / display_difficulty),
      filtering out climbs with too few ascents; benchmark_difficulty (setter/curated) is a cleaner-but-narrower
      alternative ground truth [frontiers-grading-bias]{2}, [kilter-schema]{4}.
    - The same climb (same uuid/layout) appears as separate rows per angle, each with its own difficulty
      and ascent count — these are correlated samples that must be kept in the same train/test split to
      avoid leakage [kilter-schema]{4}, [connectome-leakage]{3}.
    - Preprocessing/feature-selection fit on the full dataset before splitting inflates metrics, worst
      when the signal is weak (low-ascent climbs); fit all preprocessing inside the training fold only
      [connectome-leakage]{3}.
    - Models must be evaluated for out-of-distribution generalization (e.g., across hold-set/layout configurations
      and angles), not just in-distribution; current methods remain below human level on generalization
      [board-to-board]{1}.
    - The grade distribution is class-imbalanced toward easier climbs, which distorts plain accuracy and
      demands stratified reporting and imbalance-aware metrics [frontiers-grading-bias]{2}.
  .research/briefs/kilter-grade-prediction/feature-engineering.md:
    summary: 'A climb is converted to ML features in two stages. First, decode the frames string (pXXXXrXX
      tokens) through the board''s SQLite tables (placements → holes (x,y); placement_roles → start/middle/finish/foot)
      into a set of (x, y, role) holds. Second, derive features over that point set: per-hold counts and
      density, height statistics, hand-hold inter-distance / span / reach (especially the largest move),
      foot-vs-hand counts, role-based position features, and board angle. Prior work converges on two
      predictive families: a one-hot hold grid (lets a CNN learn spatial structure) and a sequenced move
      representation (BetaMove''s 22-dim per-move vector of target position, relative distance to the
      previous two holds, per-hold difficulty, foot placement, and a reach-feasibility success score),
      the latter being the more predictive but requiring a move-ordering heuristic.

      '
    key_findings:
    - The Kilter frames string decodes deterministically to geometry via the app's SQLite tables — pXXXXrXX
      → placements.hole_id → holes.(x,y), with role_id giving hand/foot and start/finish semantics. This
      decode is the prerequisite for every geometric feature. [kilter-frames-db-schema]{4}
    - Two representations dominate prior MoonBoard work — a one-hot 18×11 hold grid, and a sequenced per-move
      vector. Sequencing the holds is consistently reported as the single most predictive choice. [frontiers-grading-bias-survey]{3}
    - BetaMove's 22-dim per-move vector is the most concrete reusable feature recipe — target hold position,
      relative distance to the previous two holds, difficulty scale of all three holds, foot placement,
      and a per-move success score. [duh-chang-moonboardrnn]{1}
    - Move feasibility ("success score") is modeled from Euclidean inter-hold distance combined with hand-specific
      per-hold difficulty via a sum-of-Gaussians reach model — i.e. reach/span is the load-bearing geometric
      signal. [moonboardrnn-betamove-code]{2}
    - Path-finding studies enumerate reusable hand-engineered features as node costs (reach/stretch limits,
      center-of-mass proximity, hold-type difficulty, limb crossing) and edge costs (cumulative inter-hold
      distance, limb-change frequency, COM deviation). [frontiers-grading-bias-survey]{3}
    - Per-hold difficulty/quality is itself a strong learned feature (incut depth in a Bayesian net hit
      71% over three grades); for Kilter this can be recovered data-drivenly from how a given placement
      co-occurs with graded climbs. [frontiers-grading-bias-survey]{3}
    - Grade prediction underestimates the hardest climbs (GradeNet degrades above ~V8), so features that
      capture extreme single-move difficulty deserve extra weight. [duh-chang-moonboardrnn]{1}
  .research/briefs/kilter-grade-prediction/in-browser-inference.md:
    summary: 'For a client-only PWA, the simplest reliable path depends on the offline model family. A
      gradient-boosted tree model (XGBoost/LightGBM/sklearn) cannot go through TensorFlow.js — TF.js is
      neural-net-only — so it must be converted to ONNX (via onnxmltools/sklearn-onnx) and run with ONNX
      Runtime Web on the WASM (CPU) backend. A neural net can take either path, but ONNX Runtime Web still
      gives the most uniform deployment story across model families. The dominant correctness risk is
      not the runtime but two forms of train/serve skew: (1) float32-vs-float64 discrepancies at tree
      decision boundaries, which are sharp and unbounded for the discontinuous tree function, and (2)
      reimplementing the Python feature-extraction pipeline in JavaScript without bit-for-bit parity.
      Both are mitigated by exporting preprocessing into the ONNX graph where possible and validating
      exported predictions against the Python model on a held-out set before shipping.

      '
    key_findings:
    - TensorFlow.js converts only TensorFlow SavedModel and Keras (neural-net) models; it has no native
      support for XGBoost/LightGBM/gradient-boosted trees, so a tree model destined for the browser must
      route through ONNX, not TF.js [tfjs-converter]{1}.
    - ONNX Runtime supports ONNX-ML and runs traditional tree models (sklearn, LightGBM, XGBoost, LibSVM)
      via the ai.onnx.ml operator domain (TreeEnsembleRegressor/Classifier); onnxmltools and sklearn-onnx
      perform the offline conversion [onnx-traditional-ml]{2} [onnxmltools-repo]{3} [sklearn-onnx-lightgbm-pipeline]{4}.
    - The biggest tree train/serve-skew risk is precision - sklearn/LightGBM compute in float64 but ONNX
      defaults to float32; at a tree's discontinuous decision boundary even a tiny dx flips a comparison
      and sends traversal down the wrong branch, so discrepancies are unbounded, not derivative-bounded
      [sklearn-onnx-float-double]{5}.
    - Mitigations are concrete - keep preprocessing in double precision and cast to float32 only just
      before tree ops, and use the TreeEnsembleRegressor `split` option to recover double-precision summation
      across many trees; always validate exported predictions on a held-out set before deploy [sklearn-onnx-float-double]{5}
      [sklearn-onnx-lightgbm-reg-split]{6}.
    - ONNX Runtime Web's default execution provider is WASM (CPU); multi-threading needs WebAssembly threads
      AND `crossOriginIsolated`, which requires serving COOP `same-origin` + COEP `require-corp` headers
      so SharedArrayBuffer is available — otherwise it silently falls back to single-threaded [onnx-web-env-flags]{7}
      [coop-coep-sab]{8}.
    - For a small tabular model (a few features, one GBT ensemble), single-threaded WASM with SIMD is
      more than fast enough; SIMD processes 4-8 values per instruction, and a tree-ensemble forward pass
      over a single climb is sub-millisecond-class work, so the COOP/COEP complexity is optional for trees
      [coop-coep-sab]{8} [onnx-web-env-flags]{7}.
    - Replicating Python feature extraction in JavaScript is the second skew source; the most reliable
      defense is to push as much preprocessing as possible into the ONNX graph (sklearn-onnx converts
      whole pipelines, not just the estimator) so JS only assembles raw inputs [sklearn-onnx-lightgbm-pipeline]{4}
      [sklearn-onnx-float-double]{5}.
  .research/briefs/kilter-grade-prediction/parent.md:
    summary: 'No published Kilter-specific grade predictor exists; the field is MoonBoard, where route-only
      models cluster at ~42-47% exact-grade and ~84% within ±1 grade (best regression ~0.87 MAE). For
      Kilter, the low-risk starting point is engineered geometric/move-summary features feeding a gradient-boosted-tree
      regressor on per-angle difficulty_average, evaluated with GroupKFold grouped on climb_uuid on the
      Vilin97/KilterBoard dataset (which ships UUID-disjoint splits), then exported GBT→ONNX and run single-threaded
      WASM in-browser via ONNX Runtime Web. BetaMove-style move decomposition and deep models (a small
      role-channel CNN being the most export-friendly) are a documented next step, not the start — and
      the literature genuinely splits on whether move-decomposition is the key enabler or a bias source.

      '
    decisions:
    - Start with engineered geometric/move-summary tabular features (hold/role counts, density, height
      extent, reach/span summaries especially the largest hand move, per-placement learned difficulty,
      board angle) feeding a gradient-boosted-tree regressor; angle is a first-class feature, not a constant.
      [duh-chang-moonboardrnn]{1}, [grinsztajn-tree-vs-dl-tabular]{1}
    - Frame the problem as numeric-index regression on per-angle difficulty_average (continuous community-consensus
      grade), not plain multiclass. [ordinal-regression-wikipedia]{2}
    - Train and evaluate on Vilin97/KilterBoard using GroupKFold grouped on climb_uuid (after near-duplicate
      merging), fitting all preprocessing inside the training fold; report MAE/RMSE + exact + within-±1
      accuracy overall, per-grade-band, and per-angle on a high-ascent gold slice. [hf-vilin97-kilterboard]{6},
      [connectome-leakage]{3}, [frontiers-grading-bias]{2}
    - Filter labels by ascent count (start ~ascensionist_count>=5, quality>2.6) and layer kilterbench's
      Quick-Log truncation + drop-<500-repeats hygiene; treat the threshold as empirically tunable, not
      fixed. [kilter-schema]{4}, [github-kilterbench]{5}
    - Export GBT→ONNX via onnxmltools/sklearn-onnx (TreeEnsembleRegressor, zipmap=False, ai.onnx.ml opset
      2) and serve with ONNX Runtime Web on single-threaded WASM; skip COOP/COEP for the tree model; validate
      ONNX-vs-Python predictions on a held-out set as a deploy gate. [onnx-traditional-ml]{2}, [sklearn-onnx-lightgbm-pipeline]{4},
      [sklearn-onnx-float-double]{5}
    - Treat BetaMove-style move decomposition and deep models (a small role-channel CNN as the most export-friendly;
      LSTM/attention-pool and an inductive move-graph GNN as further options) as a documented next step
      that must beat the GBT baseline before adoption. [duh-chang-rnn]{1}, [tai-gcn]{2}, [poirier-transformer]{3}
    key_findings:
    - No source-direct fully-benchmarked Kilter (not MoonBoard) grade predictor was found; the ~42-47%
      exact / ~84% within-±1 / ~0.87 MAE band is a MoonBoard prior to validate on Kilter, not a Kilter
      target. [arxiv-board-to-board-2311-12419]{3}, [frontiers-grading-bias-2024]{1}
    - ? Gradient-boosted trees are the correct first baseline on engineered tabular features — state-of-the-art
        on medium tabular data, CPU-trainable, interpretable, ONNX-exportable. [grinsztajn-tree-vs-dl-tabular]{1}
        Caveat
      : Vilin97/KilterBoard is ~100K–1M rows [hf-vilin97-kilterboard]{1}, larger than the regime where
        trees dominate most — so a small CNN is a co-baseline to benchmark, not a deferred step.
    - The target is per-angle community-consensus difficulty (difficulty_average / display_difficulty),
      filtered by ascent count; the same climb_uuid recurs as one row per angle, so splits must group
      on climb_uuid or the model "predicts" grades it has effectively seen. [kilter-schema]{4}, [connectome-leakage]{3}
    - Vilin97/KilterBoard is the natural prediction substrate — SQLite keyed by (uuid, angle), with prebuilt
      80/10/10 UUID-disjoint splits and the placement/role reference tables; load it directly (the HF
      auto-loader cannot read SQLite). [hf-vilin97-kilterboard]{6}
    - Grades are finite ordered categories — treat as numeric-index regression (order-aware) rather than
      plain multiclass; report MAE/RMSE plus exact and within-±1 accuracy, stratified per grade band and
      per angle. [ordinal-regression-wikipedia]{2}, [frontiers-grading-bias]{2}
    - The load-bearing geometric signal across prior work is inter-hold reach/span, especially the largest
      hand-to-hand move; error concentrates on hard climbs where one crux move dominates an otherwise-easy
      sequence. [duh-chang-moonboardrnn]{1}, [moonboardrnn-betamove-code]{2}
    - For trees the dominant deployment risk is not the runtime but train/serve skew: float32-vs-float64
        at tree decision boundaries (unbounded, not derivative-bounded) and JS-vs-Python feature-extraction
        divergence; mitigate by baking preprocessing into the ONNX graph and validating ONNX outputs against
        Python on a held-out set. [sklearn-onnx-float-double]{5}, [sklearn-onnx-lightgbm-pipeline]{4}
    - SHAP / TreeExplainer (not default gain importance, which "is biased to attribute more importance
      to lower splits") gives consistent per-climb attributions, enabling sandbag/soft-grade detection
      on climbs whose predicted grade diverges from consensus. [lundberg-shap-xgboost]{4}
