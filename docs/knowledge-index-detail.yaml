  .research/briefs/kilter-grade-prediction/prior-work-datasets.md:
    summary: 'Almost all published grade-prediction work targets the MoonBoard, not the Kilter Board.
      The strongest route-only MoonBoard models cluster at ~42–47% exact-grade accuracy and ~84% within-one-grade,
      with a regression SOTA of 0.87 MAE / 1.12 RMSE. The recurring lesson is that converting the static
      hold set into an inferred human move sequence (BetaMove/GradeNet) beats feeding the raw hold matrix,
      while cross-board/cross-edition generalization stays below human level. Kilter-specific ML is mostly
      route *generation* and grade-inflation analysis, not prediction. Two reusable HuggingFace Kilter
      datasets exist (Vilin97/KilterBoard — SQLite, angle-keyed, prediction-friendly; stfamod/Kilter-Board-Dataset
      — tokenized seq2seq, generation- oriented), and BoardLib is the canonical way to pull raw Kilter
      data.

      '
    key_findings:
    - Route-only MoonBoard grade-prediction accuracy ceilings are well-established and modest — ~42–47%
      exact-grade, ~84% within ±1 grade — setting a realistic prior band for a comparable Kilter model
      [frontiers-grading-bias-2024]{1}.
    - The dominant lesson across the literature is that sequencing the holds into an inferred human move
      order (BetaMove → GradeNet LSTM) materially outperforms feeding the raw hold matrix to a CNN/MLP
      [github-moonboardrnn-gradenet]{2}[frontiers-grading-bias-2024]{1}.
    - Cross-board / cross-edition generalization is the main unsolved problem — SOTA regression (0.87
      MAE) holds within a board but generalization "is below human level performance currently"; for Kilter
      this maps to generalizing across angles and layouts [arxiv-board-to-board-2311-12419]{3}.
    - There is essentially no published Kilter *grade-prediction* model; existing Kilter ML is route generation
      (genclimb/stfamod) and grade-inflation/benchmark statistics (kilterbench) [hf-stfamod-kilter-board-dataset]{4}[github-kilterbench]{5}.
    - Two ready Kilter datasets exist with different shapes — Vilin97/KilterBoard is a SQLite corpus keyed
      by (uuid, angle) with 80/10/10 UUID-disjoint splits and is directly usable for prediction; stfamod/Kilter-Board-Dataset
      is a tokenized [Board,Difficulty]→[Frames] seq2seq set aimed at generation [hf-vilin97-kilterboard]{6}[hf-stfamod-kilter-board-dataset]{4}.
    - Crowd-sourced Kilter labels are biased — the "Quick Log Ascent" flash mechanism inflates the assigned-grade
      bin; kilterbench mitigates by truncating that bin to ≤50% of repeats and dropping climbs with <500
      repeats [github-kilterbench]{5}.
