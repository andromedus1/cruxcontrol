  docs/briefs/board-control-web-bluetooth.md:
    summary: 'The browser-side integration layer for board control: the Web Bluetooth

      connection lifecycle (user-gesture requestDevice → gatt.connect → service →

      characteristic), disconnect/reconnect handling, GATT operation serialization, the

      secure-context requirement, and a mock-adapter strategy for CI. The LED packet

      protocol itself is already covered by hardware-and-protocol.md; this brief covers

      what that brief does not — getting bytes to the board reliably from a browser.

      '
    key_findings:
    - requestDevice must be triggered by a user gesture; the API works only in secure (HTTPS) contexts.
    - GATT attributes are invalidated on disconnect and MUST be re-retrieved after reconnecting (gattserverdisconnected
      event).
    - GATT operations must be serialized — parallel reads/writes can error platform-dependently; queue
      them.
    - Grip Connect (TypeScript) is the reference Web Bluetooth client and explicitly supports Aurora/Kilter
      LED boards.
    - Wrap BLE behind a port with a mock adapter so the board-control path is testable in CI without hardware.
  docs/briefs/board-rendering-and-filtering.md:
    summary: 'Curates the climb-browser layer: Climbdex is the prime prior-art reference for

      board rendering (image + positioned hold overlays driven by the holes/placements

      coordinates) and filter-by-hold (URL-param-encoded, bookmarkable). Establishes the

      rendering data flow from the schema and flags that exact coordinate-mapping math

      must be read from Climbdex''s source rather than any doc.

      '
    key_findings:
    - 'Climbdex is the prior-art reference: filter-by-hold over a BoardLib SQLite DB, filter state encoded
      in URL query params (bookmarkable).'
    - Rendering = a board background image + holds positioned by their holes (x,y) coordinates per the
      layout/product_size.
    - Climbdex stack is Flask/Python + Jinja + JS; our renderer is client-side over the local OPFS SQLite
      read path instead.
    - Filtering runs as SQL over the local catalog — grade/angle/quality/setter plus hold-presence; shareable
      URLs fall out of URL-encoded filter + climb id.
    - Exact hold coordinate→screen mapping and image assets must be read from Climbdex's source; the README
      does not specify them.
  docs/briefs/catalog-sync-api.md:
    summary: 'Curates the Kilter catalog-sync layer: BoardLib is the canonical reference

      implementation (download SQLite, then sync via the API; shared/public data only by

