  docs/briefs/foundation-pwa-sqlite.md:
    summary: 'Curates the foundation-layer decisions for CruxControl as a distributable,

      offline-first PWA: the in-browser SQLite approach (wa-sqlite OPFSCoopSyncVFS in a

      Web Worker, IndexedDB fallback), the framework choice (client-only React + Vite

      SPA), and the PWA/static-hosting strategy (vite-plugin-pwa + a custom-header-capable

      static host). Key load-bearing constraint: the catalog read path runs in a Worker,

      and the chosen VFS avoids the COOP/COEP headers the official SQLite-Wasm build forces.

      '
    key_findings:
    - sql.js is in-memory only (no persistence beyond whole-file import/export) — unsuitable as the durable
      catalog read path.
    - wa-sqlite OPFSCoopSyncVFS performs well past 1GB and supports concurrent connections; it uses OPFS
      sync access handles directly, avoiding the SharedArrayBuffer→COOP/COEP requirement the official
      @sqlite.org build imposes.
    - Any OPFS synchronous SQLite path must run inside a dedicated Web Worker; the main thread queries
      it via messaging.
    - Web Bluetooth is Chromium-only (~77% global), HTTPS/secure-context + user-gesture gated — matches
      the SPEC's accepted browser constraint.
    - 'Recommended stack: client-only React + Vite SPA, wa-sqlite (OPFSCoopSyncVFS) in a Worker, vite-plugin-pwa
      for offline shell + install, static deploy to a custom-header-capable host (Cloudflare Pages).'
  docs/briefs/hardware-and-protocol.md:
    summary: 'Technical primer for the Fullride 7x10: board dimensions and hold/LED counts, the BLE communication
      protocol (service/characteristic UUIDs, packet framing 0x01/0x02/0x03, checksums, multi-packet splitting,
      API level 3 with 3 bytes per hold and 256 colors), the LED/hold addressing system, angle adjustment,
      and the community tooling that documents all of it.

      '
    key_findings:
    - Fullride 7x10 = 305 bolt-on holds, 450 LEDs, 60 footholds; BLE API level 3.
    - Discovery service UUID 4488B571-7806-4DF6-BCFF-A2897E4953FF; write characteristic 6E400002-B5A3-F393-E0A9-E50E24DCCA9E
      (Nordic UART RX).
    - LED commands use packet framing (0x01/0x02/0x03) with checksums and multi-packet splitting for climbs
