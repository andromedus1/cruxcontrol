  docs/briefs/recommendations-and-training.md:
    summary: 'Two threads for epic-recommendations: (1) the recsys approach — content-based

      filtering (item features + predicted grade), which by design needs no other users''

      data and fits a single-user app; collaborative filtering is the wrong tool here.

      (2) the training-science framing — progressive overload requires intensity +

      frequency + deliberate progression, and climbing''s variability undermines that;

      a board + grade model is precisely a "reduced-variability" progression tool, which

      is what makes targeted recommendations and circuits worth building.

      '
    key_findings:
    - Content-based filtering recommends by item features and needs NO data about other users — the right
      fit for a single-user app.
    - 'Collaborative filtering is the wrong tool here: no user base to draw cross-user signal from.'
    - 'Recommendation features come free from the catalog + grade model: predicted grade, hold features,
      angle, style; the logbook supplies the ''liked'' set.'
    - Progressive overload needs intensity + frequency + deliberate progression; climbing variability
      means 'no single movement pattern receives consistent progressive overload'.
    - A board + grade model is a structured 'reduced-variability' progression tool — the training rationale
      for circuits, progressive-overload suggestions, and weakness targeting.
