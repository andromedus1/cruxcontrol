  docs/briefs/foundation-pwa-sqlite.md:
    summary: |
      Foundation-layer decisions for CruxControl as a distributable, offline-first
      PWA: in-browser SQLite (wa-sqlite OPFSCoopSyncVFS in a Web Worker, IndexedDB
